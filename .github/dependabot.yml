# Monthly dependency updates. Minor and patch bumps are grouped into one
# pull request per ecosystem; CI (backend tests, frontend build) checks them.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The README supports Node.js 20+, so the Node type definitions stay on
      # the oldest supported major. Otherwise code could type-check against
      # Node APIs that Node 20 does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
