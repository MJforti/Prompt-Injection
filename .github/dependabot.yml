# Monthly dependency updates. Minor and patch bumps are grouped into one
# pull request per ecosystem; CI (backend tests, frontend build) checks them.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The README supports Node.js 20+, so the Node type definitions stay on
      # the oldest supported major. Otherwise code could type-check against
      # Node APIs that Node 20 does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # `typescript` stays on 6.0 for Next.js and typescript-eslint, which load its
      # JavaScript API (typescript-eslint supports < 6.1). Type checking already
      # runs on TypeScript 7 through the `typescript7` alias. Remove this rule once
      # typescript-eslint supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
