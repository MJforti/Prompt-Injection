# Used by Vercel to deploy the backend (it reads dependencies from here, not requirements.txt).
# Keep these versions in sync with requirements.txt.
[project]
name = "contextshield-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.5",
    "pydantic==2.14.3",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "reportlab==5.1.0",
]

[tool.vercel]
entrypoint = "app.main:app"
